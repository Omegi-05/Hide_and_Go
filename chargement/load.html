   <body>
    <div class="countdown-screen screen-3" id="screen3">
        <div class="chiiffre">3</div>
    </div>

    <div class="countdown-screen screen-2" id="screen2">
        <div class="chiiffre">2</div>
    </div>

    <div class="countdown-screen screen-1" id="screen1">
        <div class="chiiffre">1</div>
    </div>
 
    <script> 
    
    window.addEventListener("load", () => {
  const screens = [
    document.getElementById("screen3"),
    document.getElementById("screen2"),
    document.getElementById("screen1"),
  ];

  let currentScreen = 0;

  function showNextScreen() {
    if (currentScreen > 0) {
      screens[currentScreen - 1].classList.remove("active");
      screens[currentScreen - 1].classList.add("exit");
    }

    if (currentScreen < screens.length) {
      screens[currentScreen].classList.add("active");
      currentScreen++;
      setTimeout(showNextScreen, 1200);
    } else {
      setTimeout(() => {
        screens.forEach((screen) => (screen.style.display = "none"));
        
        setTimeout(() => { 
    function myFunction() {
            window.location.href = '../game.html';
                            }
                            myFunction();
      }, 600);
    }, 600);
  }
} 
  setTimeout(showNextScreen, 300);
    });
// je hais le js
</script>

  </body>
</html>
