<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="profil.css" rel="stylesheet" type="text/css" />
    <link rel="shortcut icon" type="image/x-icon" href="images/icon.png" />
    <title>Hide&Go - Profil</title>
  </head>
  <body>
    <div class="en-tete-profil">
      <button class="bouton-retour" onclick="window.history.back()">←</button>
      <h1 class="titre-profil">PROFIL</h1>
    </div>

    <div class="conteneur-avatar">
              <div class="avatar">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1l-5.2 2.2v4.7h2v-3.4l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"
          />
        </svg>
      </div>
      <div class="nom-agent">XX_PRO_GAMER_XX</div>
      <div class="niveau-classe">NIVEAU 67 - CAMPEUR</div>
    </div>

    <div class="grille-stats">
      <!-- Badges -->
      <div class="carte-stat">
        <div class="contenu-carte">
          <svg
            class="icone-stat"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"
              fill="black"
            />
          </svg>
          <div class="valeur-stat">147</div>
          <div class="label-stat">BADGES</div>
        </div>
      </div>

      <!-- Victoires -->
      <div class="carte-stat beige">
        <div class="contenu-carte">
          <svg
            class="icone-stat"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M7 3H17C18.1 3 19 3.9 19 5V21L12 18L5 21V5C5 3.9 5.9 3 7 3M12 6C10.9 6 10 6.9 10 8C10 9.1 10.9 10 12 10C13.1 10 14 9.1 14 8C14 6.9 13.1 6 12 6M16 16H8V15C8 13.67 10.67 13 12 13C13.33 13 16 13.67 16 15V16Z"
              fill="black"
            />
          </svg>
          <div class="valeur-stat">23</div>
          <div class="label-stat">VICTOIRES</div>
        </div>
      </div>

      <!-- Parties -->
      <div class="carte-stat">
        <div class="contenu-carte">
          <svg
            class="icone-stat"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M12,11.5A2.5,2.5 0 0,1 9.5,9A2.5,2.5 0 0,1 12,6.5A2.5,2.5 0 0,1 14.5,9A2.5,2.5 0 0,1 12,11.5M12,2A7,7 0 0,0 5,9C5,14.25 12,22 12,22C12,22 19,14.25 19,9A7,7 0 0,0 12,2Z"
              fill="black"
            />
          </svg>
          <div class="valeur-stat">42</div>
          <div class="label-stat">PARTIES</div>
        </div>
      </div>

      <!-- Temps de jeu -->
      <div class="carte-stat beige temps">
        <div class="contenu-carte">
          <svg
            class="icone-stat"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22C6.47,22 2,17.5 2,12A10,10 0 0,1 12,2M12.5,7V12.25L17,14.92L16.25,16.15L11,13V7H12.5Z"
              fill="black"
            />
          </svg>
          <div class="valeur-stat">12H34 H</div>
          <div class="label-stat">TEMPS</div>
        </div>
      </div>
    </div>

    <!-- Barres de progression -->
    <div class="conteneur-barres">
      <!-- Score cachette -->
      <div class="bloc-barre">
        <div class="en-tete-barre">
          <span class="titre-barre">Score Cachette</span>
          <span class="pourcentage-barre">69%</span>
        </div>
        <div class="barre-progression">
          <div class="remplissage-barre" style="width: 69%"></div>
        </div>
      </div>

      <!-- Score recherche -->
      <div class="bloc-barre">
        <div class="en-tete-barre">
          <span class="titre-barre">Score Recherche</span>
          <span class="pourcentage-barre">12%</span>
        </div>
        <div class="barre-progression">
          <div class="remplissage-barre" style="width: 12%"></div>
        </div>
      </div>
    </div>

    <!-- Section des succès récents -->
    <div class="section-succes">
      <h2 class="titre-section">SUCCÈS RÉCENTS</h2>
      <div class="grille-succes">

        <!-- Succès 1 -->
        <div class="carte-succes"></div>

        <!-- Succès 2 -->
        <div class="carte-succes"></div>
        
        <!-- Succès 3 -->
        <div class="carte-succes"></div>
        
        <!-- Succès 4 -->
        <div class="carte-succes"></div>
      </div>
    </div>

  </body>
</html>
